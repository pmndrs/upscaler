name: Publish to npm

# Publishes @pmndrs/upscaler. Merges to main never publish. Two entry points,
# both entirely in CI, share every step after "Resolve release":
#
#   1. Push a vX.Y.Z tag — including one created in the GitHub UI (Releases →
#      Draft a new release → new tag on main → Publish release). The tag IS the
#      version: package.json is stamped to it in this checkout for publishing,
#      and afterwards a `release: vX.Y.Z [skip ci]` commit brings main's
#      package.json up to the tag (only if main is behind it; never rewritten,
#      never tagged again).
#
#   2. Actions → Publish to npm → Run workflow (from main). Input `version`:
#        auto (default)       bump by Conventional Commits since the last stable
#                             tag (feat → minor, fix/perf → patch, breaking →
#                             minor while 0.x)
#        patch | minor | major  force that bump
#        X.Y.Z                exactly this version
#      plus optional `preid` (e.g. beta) to cut X.Y.Z-beta.N instead.
#      The run commits `release: vX.Y.Z [skip ci]` to main with an annotated
#      tag, pushes both atomically, and publishes in this same run. Pushes made
#      with GITHUB_TOKEN never trigger workflows, so that tag push doesn't start
#      a second publish (and [skip ci] keeps CI off the bump commit).
#      If tag vX.Y.Z already exists, `version: X.Y.Z` re-runs/repairs that tag
#      instead: nothing is created, the rest of the pipeline runs as for 1.
#
# Guards (fail the run before anything is published): the tag is "v" + SemVer,
# and the tagged commit is on origin/main.
#
# Idempotent: a version already on npm is not republished, and a GitHub Release
# is created only when the tag has none — an existing one (published with your
# own notes, or a draft) is never edited.
#
# Dist-tags: prereleases publish to their first identifier (0.3.0-beta.1 →
# beta), numeric-only ones (0.3.0-0) to `next`. A stable version publishes to
# `latest` only when it is at or above npm's current `latest` (read with
# `npm view <name> dist-tags.latest`; a 404 means a first publish, so `latest`).
# An older stable version, such as 0.2.1 after 0.3.0, publishes under its line
# tag `v<major>.<minor>-latest` (v0.2-latest), so `latest` never moves
# backwards. Any other failure to read npm's `latest` fails the run. Same rule
# as the GitHub Release: an older tag never takes "latest".
# `npm publish` runs the package's prepublishOnly gate (lint/typecheck/test/
# build) first, so a broken tree can't ship.
#
# Auth is npm Trusted Publishing (OIDC): no token or secret, and provenance is
# attached automatically. The trusted publisher registered on npmjs.com names
# this file (org pmndrs, repo upscaler, workflow publish.yml), so keep the
# filename. Full guide: docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'auto, patch, minor, major, or X.Y.Z. If tag vX.Y.Z already exists, that tag is re-published/repaired and nothing is created.'
        required: true
        default: auto
        type: string
      preid:
        description: 'Optional prerelease id (e.g. beta, rc). With auto/patch/minor/major, cuts X.Y.Z-<preid>.N.'
        required: false
        default: ''
        type: string

permissions:
  contents: write # release commit + tag, package.json catch-up commit, gh release create
  id-token: write # OIDC trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags + history, for the version, the guards and the notes
      # pnpm installs and runs the prepublishOnly gate; npm still versions and
      # publishes (Trusted Publishing is npm-CLI OIDC).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      # Pinned to a major, not @latest: npm 12 changed `npm pack --json`'s shape
      # and silently broke every release from 2026-07-29. Keep this spec
      # identical to ci.yml's so CI exercises the npm that publishes.
      - run: npm install -g npm@^11.5.1

      # The checkout is the workflow's own commit: the tag on a push, main on a
      # dispatch. Copy its release scripts aside before switching to the tag, so
      # a repair can run on a tag whose tree predates them.
      - name: Stage release tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-notes.mjs scripts/release-version.mjs "$RUNNER_TEMP/release-tools/"

      - name: Resolve release
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              if [[ "$PUSHED_REF" != refs/tags/* ]]; then
                echo "::error::Publishing runs only for tag pushes, not $PUSHED_REF."
                exit 1
              fi
              TAG="${PUSHED_REF#refs/tags/}"
              MODE="tag"
              ;;
            workflow_dispatch)
              if [[ "$PUSHED_REF" != "refs/heads/main" ]]; then
                echo "::error::Run this workflow from main, not $PUSHED_REF."
                exit 1
              fi
              REQUEST="${INPUT_VERSION:-auto}"
              EXISTING="v${REQUEST#v}"
              if git rev-parse --verify --quiet "refs/tags/$EXISTING" >/dev/null; then
                if [[ -n "$INPUT_PREID" ]]; then
                  echo "::error::Tag $EXISTING already exists; preid only applies when cutting a new version."
                  exit 1
                fi
                TAG="$EXISTING"
                MODE="existing"
                echo "Tag $TAG already exists: re-running it. Nothing will be created."
              else
                args=(--next "$REQUEST")
                if [[ -n "$INPUT_PREID" ]]; then
                  args+=(--preid "$INPUT_PREID")
                fi
                if ! VERSION=$(node "$RUNNER_TEMP/release-tools/release-version.mjs" "${args[@]}"); then
                  echo "::error::Could not compute a version from version='$REQUEST' preid='$INPUT_PREID'."
                  exit 1
                fi
                TAG="v$VERSION"
                if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
                  # "Re-run jobs" on a cut run recomputes from the original main
                  # and lands on the tag that run already created.
                  MODE="existing"
                  echo "::notice::$TAG already exists (a re-run?); re-running it. Nothing will be created."
                else
                  MODE="cut"
                  echo "Cutting $TAG."
                fi
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          {
            echo "tag=$TAG"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Cut release commit and tag
        if: steps.resolve.outputs.mode == 'cut'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${TAG#v}" -m "release: v%s [skip ci]"

          # Atomic: the commit and the tag land together or not at all. Pushed
          # with GITHUB_TOKEN, so the tag does not trigger another publish run;
          # this run publishes it below.
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"; then
            echo "::error::Could not push the release commit and $TAG (main moved since this run started?). Nothing was pushed; run the workflow again."
            exit 1
          fi

      - name: Verify release tag
        id: release
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Guard 1: "v" + SemVer. Also yields the version and whether its
          # Release should be "latest" (not when backfilling an old tag). The npm
          # dist-tag is chosen later, against npm's current latest.
          if ! described=$(node "$RUNNER_TEMP/release-tools/release-version.mjs" --describe "$TAG"); then
            echo "::error::Tag $TAG is not a v-prefixed SemVer version."
            exit 1
          fi
          read -r VERSION PRERELEASE LATEST EXTRA <<< "$described"
          if [[ -z "$VERSION" || -z "$PRERELEASE" || -z "$LATEST" || -n "$EXTRA" ]]; then
            echo "::error::release-version.mjs --describe printed '$described'."
            exit 1
          fi

          if ! COMMIT=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi

          # Guard 2: only commits that reached main publish.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::Tag $TAG points at $COMMIT, which is not on origin/main."
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"

          # The tag is the version. A tag made in the GitHub UI points at a commit
          # whose package.json still has the previous version, so stamp it here
          # (this checkout only; main is caught up after publishing).
          TAGGED_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAGGED_VERSION" != "$VERSION" ]]; then
            echo "package.json at $TAG says $TAGGED_VERSION; publishing it as $VERSION."
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null

          echo "Releasing $TAG ($COMMIT)."
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for this version
        id: npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          error_file=$(mktemp "$RUNNER_TEMP/npm-view.XXXXXX")
          set +e
          published_version=$(npm view "$NAME@$VERSION" version 2>"$error_file")
          result=$?
          set -e
          npm_error=$(<"$error_file")
          rm -f "$error_file"

          if [[ "$result" -eq 0 && "$published_version" == "$VERSION" ]]; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm_code=$(
            printf '%s\n' "$npm_error" |
              awk '$1 == "npm" && ($2 == "error" || $2 == "ERR!") && $3 == "code" { gsub("\r", "", $4); print $4; exit }'
          )
          if [[ "$result" -ne 0 && "$npm_code" == "E404" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything else (auth, network, a registry error) must not be read as
          # "absent" and trigger a doomed or duplicate publish.
          echo "::error::Unable to determine whether $NAME@$VERSION exists on npm."
          printf '%s\n' "$npm_error" >&2
          exit 1

      # `latest` only for a stable version at or above npm's current latest; an
      # older line (0.2.1 after 0.3.0) gets v0.2-latest instead. A 404 means a
      # first publish. Any other lookup failure stops the run rather than guess:
      # a wrong guess would move `latest` backwards.
      - name: Choose npm dist-tag
        id: dist
        if: steps.npm.outputs.published == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          NPM_LATEST=""
          if [[ "$PRERELEASE" == "false" ]]; then
            NAME=$(node -p "require('./package.json').name")
            error_file=$(mktemp "$RUNNER_TEMP/npm-latest.XXXXXX")
            set +e
            NPM_LATEST=$(npm view "$NAME" dist-tags.latest 2>"$error_file")
            result=$?
            set -e
            npm_error=$(<"$error_file")
            rm -f "$error_file"

            if [[ "$result" -ne 0 ]]; then
              npm_code=$(
                printf '%s\n' "$npm_error" |
                  awk '$1 == "npm" && ($2 == "error" || $2 == "ERR!") && $3 == "code" { gsub("\r", "", $4); print $4; exit }'
              )
              if [[ "$npm_code" != "E404" ]]; then
                echo "::error::Unable to read npm's latest dist-tag for $NAME; refusing to guess where $VERSION publishes."
                printf '%s\n' "$npm_error" >&2
                exit 1
              fi
              NPM_LATEST=""
            fi
          elif [[ "$PRERELEASE" != "true" ]]; then
            echo "::error::Invalid prerelease classification."
            exit 1
          fi

          if ! DIST_TAG=$(node "$RUNNER_TEMP/release-tools/release-version.mjs" --dist-tag "$VERSION" "$NPM_LATEST"); then
            echo "::error::Could not choose a dist-tag for $VERSION (npm's latest: '$NPM_LATEST')."
            exit 1
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "$VERSION is a prerelease: dist-tag '$DIST_TAG'."
          elif [[ -z "$NPM_LATEST" ]]; then
            echo "npm has no latest for this package yet: $VERSION takes dist-tag '$DIST_TAG'."
          elif [[ "$DIST_TAG" == "latest" ]]; then
            echo "$VERSION is at or above npm's latest ($NPM_LATEST): dist-tag 'latest'."
          else
            echo "::notice::$VERSION is older than npm's latest ($NPM_LATEST): publishing under dist-tag '$DIST_TAG'; 'latest' stays on $NPM_LATEST."
          fi
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.npm.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$DIST_TAG" ]]; then
            echo "::error::No dist-tag was chosen for $VERSION."
            exit 1
          fi
          echo "Publishing $VERSION under dist-tag '$DIST_TAG'"
          npm publish --access public --tag "$DIST_TAG"

      # --- Append-only GitHub Release ------------------------------------------
      - name: Generate GitHub Release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-tools/release-notes.mjs" --tag "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          LATEST: ${{ steps.release.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$VERSION" || "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag does not match the verified version."
            exit 1
          fi
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid GitHub repository identity."
            exit 1
          fi

          # List every Release, drafts included (the per-tag endpoint hides
          # drafts). A failed listing stops the run rather than risk a duplicate.
          error_file=$(mktemp "$RUNNER_TEMP/gh-releases.XXXXXX")
          set +e
          listing=$(gh api --paginate "repos/$REPOSITORY/releases" --jq '.[] | [.tag_name, (.draft | tostring)] | @tsv' 2>"$error_file")
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            echo "::error::Unable to list GitHub Releases."
            cat "$error_file" >&2
            exit 1
          fi

          state=$(
            printf '%s\n' "$listing" |
              awk -F '\t' -v tag="$TAG" '$1 == tag { print ($2 == "true" ? "draft" : "published"); exit }'
          )
          if [[ "$state" == "published" ]]; then
            echo "GitHub Release $TAG already exists; leaving it and its notes unchanged."
            exit 0
          fi
          if [[ "$state" == "draft" ]]; then
            echo "::notice::A draft GitHub Release for $TAG exists; leaving it unchanged. Publish it yourself."
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          elif [[ "$PRERELEASE" == "false" && "$LATEST" == "true" ]]; then
            release_flags=(--latest)
          elif [[ "$PRERELEASE" == "false" && "$LATEST" == "false" ]]; then
            release_flags=(--latest=false)
          else
            echo "::error::Invalid prerelease classification."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"

      # A tag made in the UI (or a repair) leaves main's package.json behind the
      # published version. Bring it up with a plain fast-forward commit — never
      # a force push, never a new tag — and only while main is still behind.
      # Concurrent merges: re-fetch and redo the commit, up to three tries.
      - name: Catch main's package.json up to the release
        if: steps.resolve.outputs.mode != 'cut'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git reset --hard --quiet # drop the publish-time stamp / a rejected attempt
            git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git checkout --quiet -B release-sync refs/remotes/origin/main

            MAIN_VERSION=$(node -p "require('./package.json').version")
            order=$(node "$RUNNER_TEMP/release-tools/release-version.mjs" --compare "$VERSION" "$MAIN_VERSION")
            if [[ "$order" != "1" ]]; then
              echo "main's package.json is $MAIN_VERSION, not behind $VERSION; nothing to catch up."
              exit 0
            fi

            npm version "$VERSION" --no-git-tag-version > /dev/null
            git commit --quiet --all -m "release: v$VERSION [skip ci]"
            if git push --quiet origin HEAD:refs/heads/main; then
              echo "Bumped main's package.json $MAIN_VERSION → $VERSION (untagged; $TAG is unchanged)."
              exit 0
            fi
            echo "main moved while catching up (attempt $attempt of 3); retrying on the new main."
          done

          echo "::error::Could not catch main's package.json up to $VERSION after 3 attempts. $TAG is published; re-run to retry."
          exit 1
