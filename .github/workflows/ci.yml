name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            # Same npm as publish.yml: the build's artifact check nests `npm pack`,
            # whose output shape varies by npm major. Keep the specs identical.
            - run: npm install -g npm@^11.5.1
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm run verify:packed-guides
            - run: npm run verify:packed-entrypoints
